<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juegos | SINAPSIS — Centro de Salud Integral</title>
<meta name="description" content="Juegos breves para entrenar memoria, atención, emociones y más. Una plataforma de Sinapsis, Centro de Salud Integral en Berazategui.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#08202e">
<meta property="og:type" content="website">
<meta property="og:title" content="Juegos | SINAPSIS">
<meta property="og:description" content="Juegos breves para entrenar memoria, atención, emociones y más. Una plataforma de Sinapsis, Centro de Salud Integral en Berazategui.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/juegos.css">
</head>
<body>

<header class="jp-header">
  <div class="jp-topbar">
    <a href="index.html" class="jp-brand"><span class="mark">🧠</span> Sinapsis</a>
    <div style="display:flex;align-items:center;gap:10px;">
      <a href="ejercicios.html" style="color:rgba(255,255,255,0.8);font-size:0.8rem;font-weight:700;">🧠 Ejercicios</a>
      <a href="infantil.html" style="color:rgba(255,255,255,0.8);font-size:1.1rem;" aria-label="Zona Infantil">🧸</a>
      <button class="jp-perfil-btn" id="btnPerfil" aria-label="Mi perfil">👤</button>
    </div>
  </div>
  <div class="jp-saludo">
    <h1 id="saludoNombre">Hola 👋</h1>
    <p>¿Qué hacemos hoy?</p>
  </div>
  <div class="jp-stats-row">
    <div class="jp-stat-chip">🔥 <span id="statRacha">0</span> día(s)</div>
    <div class="jp-stat-chip">⭐ Nivel <span id="statNivel">1</span></div>
    <div class="jp-stat-chip">🏆 <span id="statLogros">0</span>/<span id="statLogrosTotal">0</span></div>
  </div>
</header>

<div class="jp-buscador">
  <input type="text" id="inputBuscarJuego" placeholder="¿Qué juego estás buscando?">
</div>

<div id="vistaExploracionJuegos">
  <section class="jp-animo">
    <div class="jp-animo-card">
      <h2>¿Cómo estás hoy?</h2>
      <div class="jp-animo-grid" id="animoGrid"></div>
    </div>
  </section>

  <div class="jp-azar">
    <button class="jp-azar-btn" id="btnAzar">🎲 Jugar al azar</button>
  </div>

  <section class="jp-seccion" id="seccionContinuar" hidden>
    <h2>⭐ Seguí jugando</h2>
    <div class="jp-juegos-lista" id="continuarLista"></div>
  </section>

  <section class="jp-seccion" id="seccionFavoritosJuegos" hidden>
    <h2>❤️ Tus favoritos</h2>
    <div class="jp-juegos-lista" id="favoritosJuegosLista"></div>
  </section>

  <section class="jp-seccion">
    <h2>Categorías</h2>
    <div class="jp-categorias-grid" id="categoriasGrid"></div>
  </section>

  <section class="jp-seccion" id="seccionCategoriaDetalle" hidden>
    <h2><span id="catDetalleIcono"></span> <span id="catDetalleNombre"></span></h2>
    <div class="jp-juegos-lista" id="catDetalleLista"></div>
  </section>

  <section class="jp-seccion">
    <h2>🏆 Logros <span class="ver-todo" id="verTodosLogros">ver todos</span></h2>
    <div class="jp-logros-scroll" id="logrosScroll"></div>
  </section>
</div>

<div id="vistaResultadosJuegos" hidden>
  <section class="jp-seccion">
    <h2 id="resultadosJuegosTitulo">Resultados</h2>
    <div class="jp-juegos-lista" id="resultadosJuegosLista"></div>
  </section>
</div>

<!-- MODAL PERFIL -->
<div class="jp-modal-overlay" id="modalPerfil" hidden>
  <div class="jp-modal">
    <h2>Mi perfil</h2>
    <div id="modalCuentaGoogle" style="margin-bottom:18px;"></div>
    <label style="font-size:0.8rem;color:var(--text-soft);font-weight:700;">Elegí tu avatar</label>
    <div class="jp-avatares" id="avataresLista"></div>
    <label style="font-size:0.8rem;color:var(--text-soft);font-weight:700;">Tu nombre</label>
    <input type="text" id="inputNombre" placeholder="¿Cómo te llamamos?" maxlength="24">
    <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--text-soft); font-weight:700;">
      <span>Nivel <span id="modalNivel">1</span></span>
      <span id="modalXpTexto">0 / 50 XP</span>
    </div>
    <div class="jp-nivel-barra"><div class="jp-nivel-barra-fill" id="modalNivelFill"></div></div>
    <button class="jp-modal-cerrar" id="btnGuardarPerfil">Guardar</button>
  </div>
</div>

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/auth.js"></script>
<script src="data/juegos-catalogo.js"></script>
<script src="js/storage.js"></script>
<script src="js/perfil.js"></script>
<script src="js/logros.js"></script>
<script src="js/perfil-modal.js"></script>
<script type="module">
const MOODS = [
  { emoji: "😵", texto: "Saturado", cats: ["calma", "atencion"] },
  { emoji: "😴", texto: "Cansado", cats: ["calma"] },
  { emoji: "🧠", texto: "Activar la cabeza", cats: ["logica", "memoria", "numeros"] },
  { emoji: "🎨", texto: "Crear", cats: ["creatividad"] },
  { emoji: "❤️", texto: "Entender algo", cats: ["emociones", "vinculos"] },
  { emoji: "🧘", texto: "Bajar un cambio", cats: ["calma"] },
  { emoji: "🤔", texto: "Pensar", cats: ["logica", "flexibilidad"] },
  { emoji: "🎲", texto: "Sorprendeme", cats: null },
];

function irAJuego(id) { window.location.href = `juego.html?id=${id}`; }

function elegirJuegoPorCategorias(cats) {
  if (!cats) return CatalogoJuegos.aleatorioDisponible();
  const disponibles = CatalogoJuegos.disponibles();
  const pool = disponibles.filter(j => cats.includes(j.categoria));
  const lista = pool.length ? pool : disponibles;
  return lista[Math.floor(Math.random() * lista.length)];
}

function render() {
  const perfil = Storage.getPerfil();
  const racha = Storage.getRacha();
  const logros = Storage.getLogros();

  document.getElementById("saludoNombre").textContent = perfil.nombre ? `Hola, ${perfil.nombre} 👋` : "Hola 👋";
  document.getElementById("statRacha").textContent = racha.dias;
  document.getElementById("statNivel").textContent = perfil.nivel;
  document.getElementById("statLogros").textContent = logros.length;
  document.getElementById("statLogrosTotal").textContent = Logros.catalogo().length;

  // Ánimo
  const animoGrid = document.getElementById("animoGrid");
  animoGrid.innerHTML = MOODS.map((m, i) => `
    <button class="jp-animo-btn" data-i="${i}">
      <span class="emoji">${m.emoji}</span>${m.texto}
    </button>`).join("");
  animoGrid.querySelectorAll(".jp-animo-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const mood = MOODS[Number(btn.dataset.i)];
      const juego = elegirJuegoPorCategorias(mood.cats);
      irAJuego(juego.id);
    });
  });

  // Continuar jugando (últimos jugados)
  const progreso = Storage.getProgresoCompleto();
  const jugados = Object.keys(progreso)
    .filter(id => CatalogoJuegos.porId(id))
    .sort((a, b) => new Date(progreso[b].ultimaVez) - new Date(progreso[a].ultimaVez))
    .slice(0, 3);
  document.getElementById("seccionContinuar").hidden = jugados.length === 0;
  if (jugados.length) pintarListaJuegos("continuarLista", jugados.map(id => CatalogoJuegos.porId(id)), "");

  renderFavoritosJuegos();

  // Categorías
  const catGrid = document.getElementById("categoriasGrid");
  catGrid.innerHTML = CatalogoJuegos.categorias().map(cat => {
    const n = CatalogoJuegos.porCategoria(cat.id).filter(j => j.disponible).length;
    return `<button class="jp-cat-card" data-cat="${cat.id}">
      <span class="emoji">${cat.icono}</span>
      <span class="nombre">${cat.nombre}</span>
      <span class="cantidad">${n} juego${n === 1 ? "" : "s"}</span>
    </button>`;
  }).join("");
  catGrid.querySelectorAll("[data-cat]").forEach(el =>
    el.addEventListener("click", () => mostrarCategoria(el.dataset.cat)));

  // Logros
  const logrosScroll = document.getElementById("logrosScroll");
  logrosScroll.innerHTML = Logros.catalogo().map(l => {
    const tiene = logros.includes(l.id);
    return `<div class="jp-logro-card ${tiene ? "" : "bloqueado"}">
      <span class="emoji">${l.icono}</span>
      <span class="nombre">${l.nombre}</span>
    </div>`;
  }).join("");
}

function tarjetaJuego(juego) {
  const cat = CatalogoJuegos.categoriaPorId(juego.categoria);
  const fav = juego.disponible && Storage.esFavoritoJuego(juego.id);
  return `<div class="jp-juego-card ${juego.disponible ? "" : "proximamente"}" ${juego.disponible ? `data-juego="${juego.id}"` : ""} style="${juego.disponible ? "cursor:pointer" : ""}">
    <div class="icono">${cat.icono}</div>
    <div class="info">
      <div class="nombre">${juego.nombre}</div>
      <div class="desc">${juego.descripcion}</div>
    </div>
    <div class="meta">${juego.disponible ? juego.duracion : "Próximamente"}</div>
    ${juego.disponible ? `<button class="fav-btn" data-fav="${juego.id}" aria-label="Favorito" aria-pressed="${fav}">${fav ? "❤️" : "🤍"}</button>` : ""}
  </div>`;
}

/** Pinta una lista de juegos en el contenedor dado, cableando el click (ir al juego) y el botón de favorito. */
function pintarListaJuegos(contenedorId, juegos, vacioTexto) {
  const el = document.getElementById(contenedorId);
  if (!juegos.length) { el.innerHTML = `<p class="jp-vacio">${vacioTexto}</p>`; return; }
  el.innerHTML = juegos.map(tarjetaJuego).join("");
  el.querySelectorAll("[data-juego]").forEach(card => {
    card.addEventListener("click", (e) => { if (!e.target.closest("[data-fav]")) irAJuego(card.dataset.juego); });
  });
  el.querySelectorAll("[data-fav]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const ahora = Storage.toggleFavoritoJuego(btn.dataset.fav);
      btn.textContent = ahora ? "❤️" : "🤍";
      btn.setAttribute("aria-pressed", ahora);
      renderFavoritosJuegos();
    });
  });
}

function renderFavoritosJuegos() {
  const favoritos = Storage.getFavoritosJuegos().map(id => CatalogoJuegos.porId(id)).filter(Boolean);
  document.getElementById("seccionFavoritosJuegos").hidden = favoritos.length === 0;
  if (favoritos.length) pintarListaJuegos("favoritosJuegosLista", favoritos, "");
}

function mostrarCategoria(catId) {
  const cat = CatalogoJuegos.categoriaPorId(catId);
  const juegos = CatalogoJuegos.porCategoria(catId);
  document.getElementById("seccionCategoriaDetalle").hidden = false;
  document.getElementById("catDetalleIcono").textContent = cat.icono;
  document.getElementById("catDetalleNombre").textContent = cat.nombre;
  pintarListaJuegos("catDetalleLista", juegos, "Todavía no hay juegos acá.");
  document.getElementById("seccionCategoriaDetalle").scrollIntoView({ behavior: "smooth", block: "start" });
}

// ── Búsqueda ──
let filtroTextoJuego = "";

function actualizarVistaJuegos() {
  const activo = filtroTextoJuego.trim().length > 0;
  document.getElementById("vistaExploracionJuegos").hidden = activo;
  document.getElementById("vistaResultadosJuegos").hidden = !activo;
  if (!activo) return;
  const lista = CatalogoJuegos.buscar(filtroTextoJuego);
  document.getElementById("resultadosJuegosTitulo").textContent = `${lista.length} resultado${lista.length === 1 ? "" : "s"}`;
  pintarListaJuegos("resultadosJuegosLista", lista, "No encontramos juegos con ese nombre.");
}

// ── Modal perfil (lógica compartida con ejercicios.html) ──
// Se activa primero, antes que cualquier otro listener: así el login
// nunca queda inutilizado si algo más abajo llegara a fallar.
PerfilModal.iniciar(render);

document.getElementById("inputBuscarJuego").addEventListener("input", (e) => {
  filtroTextoJuego = e.target.value;
  actualizarVistaJuegos();
});

document.getElementById("btnAzar").addEventListener("click", () => irAJuego(elegirJuegoPorCategorias(null).id));
document.getElementById("verTodosLogros").addEventListener("click", () => {
  document.getElementById("logrosScroll").style.flexWrap = "wrap";
  document.getElementById("logrosScroll").style.overflowX = "visible";
});
</script>
</body>
</html>
