<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargando ejercicio… | SINAPSIS</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/ejercicios.css">
</head>
<body>

<main id="eeContenedor">
  <p style="text-align:center;color:var(--text-soft);">Cargando…</p>
</main>

<div id="eeError" hidden style="text-align:center; padding: 100px 20px;">
  <p style="font-size:1.1rem; color:#3a5a6a; margin-bottom:20px;">No encontramos ese ejercicio 🌱</p>
  <a href="ejercicios.html" style="color:#1a7a8a; font-weight:700;">← Volver a la biblioteca</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="data/ejercicios.js"></script>
<script src="js/storage.js"></script>
<script src="js/perfil.js"></script>
<script src="js/logros.js"></script>
<script src="js/beep.js"></script>
<script src="js/lienzo.js"></script>
<script src="js/exercise-engine.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const ejercicioId = params.get("id");
  const ejercicio = ejercicioId ? CatalogoEjercicios.porId(ejercicioId) : null;

  if (!ejercicio || !ejercicio.activo) {
    document.getElementById("eeContenedor").hidden = true;
    document.getElementById("eeError").hidden = false;
  } else {
    document.title = `${ejercicio.titulo} | SINAPSIS`;
    let arrancado = false;
    Auth.onCambio((user) => {
      if (arrancado) return;
      arrancado = true;
      const listo = () => ExerciseEngine.iniciar(ejercicio);
      if (user) Storage.vincularUsuario(user).then(listo);
      else listo();
    });
  }
</script>
</body>
</html>
