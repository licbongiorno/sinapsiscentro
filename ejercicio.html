<head>

<meta name="theme-color" content="#08202e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Nunito:wght@300;400;500;600;700;800&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

<link rel="stylesheet" href="css/ejercicios.css">
  <link rel="stylesheet" href="css/accesibilidad.css">
  <link rel="stylesheet" href="css/compartir.css">
  <link rel="stylesheet" href="css/lector.css">
  <link rel="stylesheet" href="css/dictado.css">
</head>
<body>

<main id="eeContenedor">
  <p style="text-align:center;color:var(--text-soft);">Cargando…</p>
</main>

<div id="eeError" hidden style="text-align:center; padding: 100px 20px;">
  <p style="font-size:1.1rem; color:#3a5a6a; margin-bottom:20px;">No encontramos ese ejercicio 🌱</p>
  <a href="ejercicios.html" style="color:#1a7a8a; font-weight:700;">← Volver a la biblioteca</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js" defer></script>
<script src="js/firebase-config.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="data/ejercicios.js" defer></script>
<script src="js/storage.js" defer></script>
<script src="js/perfil.js" defer></script>
<script src="js/logros.js" defer></script>
<script src="js/beep.js" defer></script>
<script src="js/lienzo.js" defer></script>
<script src="js/compartir.js" defer></script>
<script src="js/lector.js" defer></script>
<script src="js/dictado.js" defer></script>
<script src="js/exercise-engine.js" defer></script>
<script type="module">
  const params = new URLSearchParams(window.location.search);
  const ejercicioId = params.get("id");
  const ejercicio = ejercicioId ? CatalogoEjercicios.porId(ejercicioId) : null;

  if (!ejercicio || !ejercicio.activo) {
    document.getElementById("eeContenedor").hidden = true;
    document.getElementById("eeError").hidden = false;
  } else {
    document.title = `${ejercicio.titulo} | Centro Sinapsis`;
    let arrancado = false;
    Auth.onCambio((user) => {
      if (arrancado) return;
      arrancado = true;
      const listo = () => ExerciseEngine.iniciar(ejercicio);
      if (user) Storage.vincularUsuario(user).then(listo);
      else listo();
    });
  }
</script>
  <script src="js/accesibilidad.js" defer></script>
  <script src="js/sw-registro.js" defer></script>
</body>
</html>
