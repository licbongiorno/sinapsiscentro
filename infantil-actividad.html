<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
  <script>try{if(localStorage.getItem("sinapsis_modo_accesible")==="1")document.documentElement.classList.add("modo-accesible");}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargando… | SINAPSIS</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#08202e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/infantil.css">
  <link rel="stylesheet" href="css/accesibilidad.css">
  <link rel="stylesheet" href="css/compartir.css">
</head>
<body>

<main id="ieContenedor">
  <p style="text-align:center;color:var(--text-soft);">Cargando…</p>
</main>

<div id="ieError" hidden style="text-align:center; padding: 100px 20px;">
  <p style="font-size:1.1rem; color:#3a5a6a; margin-bottom:20px;">No encontramos esa actividad 🧸</p>
  <a href="infantil.html" style="color:#1a7a8a; font-weight:700;">← Volver a la Zona Infantil</a>
</div>

<script src="data/infantil-datos.js" defer></script>
<script src="js/infantil-storage.js" defer></script>
<script src="js/lienzo.js" defer></script>
<script src="js/beep.js" defer></script>
<script src="js/compartir.js" defer></script>
<script src="js/infantil-engine.js" defer></script>
<script type="module">
  const params = new URLSearchParams(window.location.search);
  const actividadId = params.get("id");
  const actividad = actividadId ? CatalogoInfantil.porId(actividadId) : null;

  if (!actividad || !actividad.activo) {
    document.getElementById("ieContenedor").hidden = true;
    document.getElementById("ieError").hidden = false;
  } else {
    document.title = `${actividad.titulo} | SINAPSIS`;
    InfantilEngine.iniciar(actividad);
  }
</script>
  <script src="js/accesibilidad.js" defer></script>
</body>
</html>
