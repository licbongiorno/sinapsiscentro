<script type="module">
const params = new URLSearchParams(window.location.search);
const actividadId = params.get("id");
const actividad = actividadId ? CatalogoCreatividad.porId(actividadId) : null;

if (!actividad || !actividad.activo) {
  document.getElementById("cvContenedor").hidden = true;
  document.getElementById("cvError").hidden = false;
} else {
  document.title = `${actividad.titulo} | SINAPSIS`;
  document.getElementById("cvBarra").style.display = "flex";
  document.getElementById("cvVolver").addEventListener("click", () => { window.location.href = "creatividad.html"; });

  const edad = Storage.getEdadCreatividad() || 99;
  const cat = CatalogoCreatividad.seccionPorId(actividad.seccion);
  let resultado = null;       // ingredientes generados/inspiración actual
  let salidaElegida = actividad.salida === "eleccion" ? "texto" : actividad.salida;
  let sonidoSonando = false;
  const SONIDO_ID = "cv-sonido";

  const MOTORES = {
    "animal-imposible": () => CreatividadMotor.generarAnimalImposible({ edad }),
    "personaje": () => CreatividadMotor.generarPersonaje({ edad }),
    "mundo": () => CreatividadMotor.generarMundo({ edad }),
    "historia": () => CreatividadMotor.generarHistoria({ edad }),
    "combinar": () => CreatividadMotor.combinar(actividad.bancos || []),
  };

  function resolverPrompt() {
    const r = { consigna: actividad.consigna };
    if (actividad.inspiracion) {
      const { bancos, cantidad } = actividad.inspiracion;
      if (bancos.length === 1) {
        const elegidos = CreatividadMotor.elegir(CreatividadMotor.bancos[bancos[0]], cantidad);
        r.inspiracion = Array.isArray(elegidos) ? elegidos : [elegidos];
      } else {
        r.inspiracion = bancos.map(nombre => CreatividadMotor.elegir(CreatividadMotor.bancos[nombre]));
      }
    }
    if (actividad.restriccionAleatoria) {
      r.restriccion = CreatividadMotor.elegir(RESTRICCIONES);
    }
    return r;
  }

  function generar() {
    resultado = actividad.tipo === "generador" ? (MOTORES[actividad.motor] || (() => ({})))() : resolverPrompt();
  }

  const ETIQUETAS_INGREDIENTE = {
    cabeza: "Cabeza de", cuerpo: "Cuerpo de", cola: "Cola de", color: "Color", textura: "Textura",
    habilidad: "Habilidad especial", habitat: "Vive en",
    semilla: "Personaje", objeto: "Lleva consigo", lugar: "Vive en / está en", deseo: "Desea",
    problema: "Su problema", companero: "Compañero", secreto: "Secreto", limitacion: "Limitación",
    ambiente: "Ambiente", habitante: "Habitante", recurso: "Recurso clave", regla: "Regla especial", conflicto: "Conflicto",
    genero: "Género", protagonista: "Protagonista", aliado: "Aliado", obstaculo: "Obstáculo", giro: "Giro", restriccion: "Restricción",
  };

  function renderIngredientes(r) {
    if (r.tipo === "combinacion") {
      return r.elementos.map(e => `<div class="cv-ingrediente">${e.valor}</div>`).join("");
    }
    return Object.entries(r).filter(([k]) => k !== "tipo").map(([k, v]) =>
      `<div class="cv-ingrediente"><b>${ETIQUETAS_INGREDIENTE[k] || k}:</b> ${v}</div>`).join("");
  }

  function generadorBonito() {
    return {
      "animal-imposible": "🐾 Tu animal imposible", "personaje": "🎭 Tu personaje", "mundo": "🌎 Tu mundo",
      "historia": "📖 Los ingredientes de tu historia", "combinar": "🧩 Tu combinación",
    }[actividad.motor] || "Tu resultado";
  }

  function renderIntro() {
    const cont = document.getElementById("cvContenedor");
    let html = `<p class="cv-titulo-cat">${cat ? cat.icono + " " + cat.nombre : ""}</p>
      <h1 class="cv-titulo">${actividad.titulo}</h1>
      <button class="compartir-btn" id="cvCompartir">🔗 Compartir</button>`;

    if (actividad.tipo === "generador") {
      html += `<div class="cv-ingredientes"><p style="font-weight:800;margin-bottom:8px;color:var(--navy);">${generadorBonito()}</p>${renderIngredientes(resultado)}</div>
        <div class="cv-fila-botones-h"><button class="ee-btn ee-btn-secundario" id="cvRegenerar">🎲 Generar otra combinación</button></div>`;
    } else {
      html += `<p class="cv-desc">${resultado.consigna}</p>`;
      if (resultado.inspiracion) {
        html += `<div style="text-align:center;margin-bottom:14px;">${resultado.inspiracion.map(i => `<span class="cv-inspiracion-chip">${i}</span>`).join("")}</div>
          <div class="cv-fila-botones-h"><button class="ee-btn ee-btn-secundario" id="cvRegenerar">🎲 Otras palabras</button></div>`;
      }
      if (resultado.restriccion) {
        html += `<div class="cv-ingredientes"><b>Restricción:</b> ${resultado.restriccion}</div>`;
      }
    }

    if (actividad.objetivo) {
      html += `<details class="ee-porque">
        <summary>🔬 ¿Para qué sirve?</summary>
        <p>${actividad.objetivo}</p>
      </details>`;
    }

    if (actividad.sonido) {
      html += `<div class="cv-sonido-fila">
        <button class="ee-btn ee-btn-secundario" id="cvSonido">▶️ Reproducir sonido</button>
      </div>`;
    }

    if (actividad.salida === "eleccion") {
      html += `<div class="cv-toggle-fila">
        <button class="cv-toggle-btn activo" data-modo="texto">✍️ Escribir</button>
        <button class="cv-toggle-btn" data-modo="dibujo">🎨 Dibujar</button>
      </div>`;
    }

    html += `<div id="cvEntrada"></div>
      <div class="cv-fila-botones" id="cvAcciones"></div>`;

    cont.innerHTML = html;

    const btnRegenerar = document.getElementById("cvRegenerar");
    if (btnRegenerar) btnRegenerar.addEventListener("click", () => { generar(); renderIntro(); });

    document.getElementById("cvCompartir").addEventListener("click", () => {
      Compartir.compartir({
        titulo: actividad.titulo,
        texto: `${actividad.titulo} — un recurso gratuito de Sinapsis, Centro de Salud Integral.`,
        url: window.location.href,
      });
    });

    const btnSonido = document.getElementById("cvSonido");
    if (btnSonido) btnSonido.addEventListener("click", () => {
      if (!AudioEngine.disponible()) { alert("Tu navegador no soporta reproducir sonido acá."); return; }
      if (sonidoSonando) {
        AudioEngine.detenerPista(SONIDO_ID);
        sonidoSonando = false;
        btnSonido.textContent = "▶️ Reproducir sonido";
      } else {
        if (actividad.sonido === "campana") AudioEngine.tocarCampana("campana");
        else if (actividad.sonido === "gong") AudioEngine.tocarCampana("gong");
        else AudioEngine.iniciarPistaProcedural(SONIDO_ID, actividad.sonido);
        if (actividad.sonido !== "campana" && actividad.sonido !== "gong") {
          AudioEngine.setVolumen(SONIDO_ID, 0.5);
          sonidoSonando = true;
          btnSonido.textContent = "⏸️ Detener sonido";
        }
      }
    });

    document.querySelectorAll(".cv-toggle-btn").forEach(btn => btn.addEventListener("click", () => {
      document.querySelectorAll(".cv-toggle-btn").forEach(b => b.classList.remove("activo"));
      btn.classList.add("activo");
      salidaElegida = btn.dataset.modo;
      renderEntrada();
    }));

    renderEntrada();
  }

  let lienzo = null;
  let fotoDataUrl = null;

  /** Redimensiona/comprime una imagen para que quepa cómoda en Firestore (límite 1MB por documento). */
  function comprimirImagen(file) {
    return new Promise((resolve, reject) => {
      const lector = new FileReader();
      lector.onload = () => {
        const img = new Image();
        img.onload = () => {
          const MAX = 700;
          let { width, height } = img;
          if (width > height && width > MAX) { height = Math.round(height * MAX / width); width = MAX; }
          else if (height > MAX) { width = Math.round(width * MAX / height); height = MAX; }
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", 0.72));
        };
        img.onerror = reject;
        img.src = lector.result;
      };
      lector.onerror = reject;
      lector.readAsDataURL(file);
    });
  }

  function renderCapturaFoto() {
    const entrada = document.getElementById("cvEntrada");
    entrada.innerHTML = `
      <div class="cv-foto-wrap">
        ${fotoDataUrl
          ? `<img src="${fotoDataUrl}" alt="" class="cv-foto-preview">
             <button class="ee-btn ee-btn-secundario" id="cvFotoRetomar">🔄 Sacar otra</button>`
          : `<button class="ee-btn ee-btn-principal" id="cvFotoAbrir">📷 Sacar foto</button>`}
        <input type="file" accept="image/*" capture="environment" id="cvFotoInput" hidden>
        <p class="cv-foto-privacidad">La foto se guarda solo en este dispositivo (o en tu cuenta, si iniciaste sesión) — nunca se sube a ningún otro lado.</p>
      </div>`;
    const input = document.getElementById("cvFotoInput");
    const abrir = () => input.click();
    const btnAbrir = document.getElementById("cvFotoAbrir");
    const btnRetomar = document.getElementById("cvFotoRetomar");
    if (btnAbrir) btnAbrir.addEventListener("click", abrir);
    if (btnRetomar) btnRetomar.addEventListener("click", abrir);
    input.addEventListener("change", async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      try {
        fotoDataUrl = await comprimirImagen(file);
      } catch (e) {
        alert("No se pudo procesar la foto. Probá de nuevo.");
        return;
      }
      renderCapturaFoto();
      renderAcciones();
    });
  }

  function renderEntrada() {
    const entrada = document.getElementById("cvEntrada");
    if (salidaElegida === "foto") {
      renderCapturaFoto();
      renderAcciones();
      return;
    }
    if (salidaElegida === "dibujo") {
      entrada.innerHTML = `<div class="cv-lienzo-wrap">
        <canvas id="cvLienzo" class="cv-lienzo" width="600" height="500"></canvas>
        <div class="cv-lienzo-controles">
          ${(() => { const nombres = { "#0d2535": "Azul oscuro", "#2aaec2": "Celeste", "#e08a8a": "Rosa", "#8ac9a9": "Verde agua", "#c9a97e": "Marrón claro", "#a98ac9": "Violeta" };
            return Object.keys(nombres).map(c => `<button class="cv-color-btn" data-c="${c}" style="background:${c}" aria-label="${nombres[c]}"></button>`).join(""); })()}
          <button class="cv-icon-btn" data-borrar="1">🧽 Goma</button>
          <button class="cv-icon-btn" data-deshacer="1">↩️ Deshacer</button>
          <button class="cv-icon-btn" data-limpiar="1">🗑️ Limpiar</button>
        </div>
      </div>`;
      const canvas = document.getElementById("cvLienzo");
      lienzo = crearLienzoDibujable(canvas, { colorInicial: "#0d2535", grosor: 5 });
      entrada.querySelectorAll("[data-c]").forEach(b => b.addEventListener("click", () => lienzo.setColor(b.dataset.c)));
      entrada.querySelector("[data-borrar]").addEventListener("click", () => lienzo.setModo("borrar"));
      entrada.querySelector("[data-deshacer]").addEventListener("click", () => lienzo.deshacer());
      entrada.querySelector("[data-limpiar]").addEventListener("click", () => lienzo.limpiar());
    } else {
      entrada.innerHTML = `<textarea class="ee-textarea" id="cvTextarea" placeholder="Escribí acá…" style="min-height:180px;"></textarea>`;
    }
    renderAcciones();
  }

  function tipoDeCreacion() {
    if (salidaElegida === "foto") return "foto";
    if (salidaElegida === "dibujo") return "dibujo";
    if (actividad.motor === "personaje") return "personaje";
    if (actividad.motor === "mundo") return "mundo";
    if (actividad.seccion === "escribir") {
      return /poema|haiku|verso/i.test(actividad.titulo) ? "poema" : "historia";
    }
    return "idea";
  }

  function contenidoParaGuardar() {
    if (salidaElegida === "foto") return fotoDataUrl;
    if (salidaElegida === "dibujo") return lienzo ? lienzo.dataUrl() : null;
    const ta = document.getElementById("cvTextarea");
    return ta ? ta.value.trim() : null;
  }

  function renderAcciones() {
    const acciones = document.getElementById("cvAcciones");
    acciones.innerHTML = `
      <button class="ee-btn ee-btn-principal" id="cvGuardar">💾 Guardar en mi galería</button>
      <button class="ee-btn ee-btn-texto" id="cvSinGuardar">Continuar sin guardar</button>`;
    document.getElementById("cvGuardar").addEventListener("click", guardarCreacion);
    document.getElementById("cvSinGuardar").addEventListener("click", () => { window.location.href = "creatividad.html"; });
  }

  function guardarCreacion() {
    const contenido = contenidoParaGuardar();
    if (!contenido || (typeof contenido === "string" && salidaElegida !== "dibujo" && !contenido.trim())) {
      alert("Todavía no creaste nada para guardar.");
      return;
    }
    const tipo = tipoDeCreacion();
    const creacion = Storage.guardarCreacion({
      tipo, titulo: actividad.titulo, contenido,
      meta: { actividadId: actividad.id, resultado },
    });
    if (!creacion) {
      alert("No se pudo guardar: el almacenamiento de este dispositivo está lleno. Probá borrar alguna creación vieja desde Mi galería y volvé a intentar.");
      return;
    }
    // Reutiliza el mismo store de progreso que Ejercicios/Mindfulness
    // (keyeado por id, no por catálogo) para que "Realizados" y los
    // minutos totales funcionen igual acá que en el resto del sitio.
    Storage.registrarEjercicioCompletado(actividad.id, { minutos: actividad.duracion });
    const nuevos = Logros.evaluarTrasCreacion();
    mostrarFinal(creacion, tipo, nuevos);
  }

  function mostrarFinal(creacion, tipo, nuevos) {
    const cont = document.getElementById("cvContenedor");
    cont.innerHTML = `
      <div class="cv-final">
        <p class="cv-final-emoji">🎉</p>
        <h1 class="cv-titulo">¡Guardado!</h1>
        <p class="cv-desc">Tu creación ya está en Mi galería.</p>
        <div class="cv-fila-botones-h" id="cvExportar"></div>
        <div class="cv-fila-botones" style="margin-top:18px;">
          <button class="ee-btn ee-btn-secundario" id="cvOtraVez">🔁 Crear otra vez</button>
          <button class="ee-btn ee-btn-secundario" id="cvVerGaleria">🖼️ Ver mi galería</button>
          <button class="ee-btn ee-btn-texto" id="cvVolverFinal">← Volver a Creatividad</button>
        </div>
        ${nuevos.length ? `<div class="ee-logros-nuevos">${nuevos.map(l => `<div class="ee-logro-chip">${l.icono} ${l.nombre}</div>`).join("")}</div>` : ""}
      </div>`;

    const exportar = document.getElementById("cvExportar");
    if (tipo === "dibujo" || tipo === "foto") {
      exportar.innerHTML = `<button class="ee-btn ee-btn-secundario" id="cvDescargarImg">🖼️ Descargar imagen</button>`;
      document.getElementById("cvDescargarImg").addEventListener("click", () => {
        const extension = tipo === "foto" ? "jpg" : "png";
        Exportar.descargarImagen({ dataUrl: creacion.contenido, nombreArchivo: Exportar.nombreArchivo({ tipo: tipo === "foto" ? "Foto" : "Dibujo", titulo: actividad.titulo, extension }) });
      });
    } else {
      exportar.innerHTML = `
        <button class="ee-btn ee-btn-secundario" id="cvDescargarTxt">📄 Descargar TXT</button>
        <button class="ee-btn ee-btn-secundario" id="cvImprimir">🖨️ Imprimir / PDF</button>`;
      document.getElementById("cvDescargarTxt").addEventListener("click", () => {
        Exportar.descargarTxt({
          contenido: `${creacion.titulo}\n\n${creacion.contenido}`,
          nombreArchivo: Exportar.nombreArchivo({ tipo, titulo: actividad.titulo, extension: "txt" }),
        });
      });
      document.getElementById("cvImprimir").addEventListener("click", () => {
        Exportar.imprimir({ tituloPagina: creacion.titulo, bloques: [{ titulo: creacion.titulo, texto: creacion.contenido }] });
      });
    }
    document.getElementById("cvOtraVez").addEventListener("click", () => window.location.reload());
    document.getElementById("cvVerGaleria").addEventListener("click", () => { window.location.href = "creatividad.html#galeria"; });
    document.getElementById("cvVolverFinal").addEventListener("click", () => { window.location.href = "creatividad.html"; });
  }

  /**
   * Las actividades "motor: juego" son las migradas de Juegos (misma
   * categoría "creatividad" de antes): usan GameEngine directamente,
   * igual que mindfulness-item.html hace con sus prácticas migradas
   * de motor "juego". window.__geVolverA hace que los botones de
   * volver/pausa/otro juego del HUD vuelvan a Creatividad en vez de
   * a Juegos (ver comentario en js/game-engine.js).
   */
  function iniciarJuego() {
    document.getElementById("cvBarra").style.display = "none";
    document.getElementById("cvContenedor").hidden = true;
    document.getElementById("juego-area").hidden = false;
    document.getElementById("jgTitulo").textContent = actividad.titulo;
    document.getElementById("jgInstruccion").textContent = actividad.descripcion;
    window.__geVolverA = "creatividad.html";
    const script = document.createElement("script");
    script.src = actividad.archivo;
    document.body.appendChild(script);
  }

  let arrancado = false;
  Auth.onCambio((user) => {
    if (arrancado) return;
    arrancado = true;
    const listo = actividad.motor === "juego" ? iniciarJuego : () => { generar(); renderIntro(); };
    if (user) Storage.vincularUsuario(user).then(listo);
    else listo();
  });
}
</script>
  <script src="js/accesibilidad.js" defer></script>
</body>
