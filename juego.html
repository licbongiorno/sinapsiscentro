<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
  <script>try{if(localStorage.getItem("sinapsis_modo_accesible")==="1")document.documentElement.classList.add("modo-accesible");}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargando juego… | SINAPSIS</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#08202e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/juego.css">
  <link rel="stylesheet" href="css/accesibilidad.css">
  <link rel="stylesheet" href="css/recordatorio-racha.css">
  <link rel="stylesheet" href="css/compartir.css">
</head>
<body>

<main id="juego-area">
  <h1 class="jg-titulo" id="jgTitulo">Cargando…</h1>
  <p class="jg-instruccion" id="jgInstruccion"></p>
  <details class="jg-porque" id="jgPorque" hidden>
    <summary>🧠 ¿Qué entrena?</summary>
    <p id="jgBeneficio"></p>
  </details>
  <div id="jgContenedor"></div>
</main>

<div id="jgError" hidden style="text-align:center; padding: 100px 20px;">
  <p style="font-size:1.1rem; color:#3a5a6a; margin-bottom:20px;">No encontramos ese juego, o todavía está en camino 🚧</p>
  <a href="juegos.html" style="color:#1a7a8a; font-weight:700;">← Volver al portal de juegos</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js" defer></script>
<script src="js/firebase-config.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="data/juegos-catalogo.js" defer></script>
<script src="js/storage.js" defer></script>
<script src="js/perfil.js" defer></script>
<script src="js/logros.js" defer></script>
<script src="js/beep.js" defer></script>
<script src="js/lienzo.js" defer></script>
<script src="js/compartir.js" defer></script>
<script src="js/game-engine.js" defer></script>
<script type="module">
  const params = new URLSearchParams(window.location.search);
  const juegoId = params.get("id");
  const juego = juegoId ? CatalogoJuegos.porId(juegoId) : null;

  if (!juego || !juego.disponible) {
    document.getElementById("juego-area").hidden = true;
    document.getElementById("jgError").hidden = false;
  } else {
    document.title = `${juego.nombre} | SINAPSIS`;
    document.getElementById("jgTitulo").textContent = juego.nombre;
    document.getElementById("jgInstruccion").textContent = juego.descripcion;
    if (juego.beneficio) {
      document.getElementById("jgBeneficio").textContent = juego.beneficio;
      document.getElementById("jgPorque").hidden = false;
    }

    // Esperamos a saber si hay sesión de Google antes de arrancar el
    // juego, para que los puntos y el progreso se guarden ya mismo
    // en la cuenta correcta (una sola vez; ver comentario abajo).
    let arrancado = false;
    Auth.onCambio((user) => {
      if (arrancado) return; // ignoramos cambios de sesión mientras el juego ya está en curso
      arrancado = true;
      const listo = () => {
        const script = document.createElement("script");
        script.src = juego.archivo;
        document.body.appendChild(script);
      };
      if (user) Storage.vincularUsuario(user).then(listo);
      else listo();
    });
  }
</script>

  <script src="js/accesibilidad.js" defer></script>
  <script src="js/sw-registro.js" defer></script>
  <script src="js/recordatorio-racha.js" defer></script>
</body>
</html>
