<body>

<main id="juego-area">
  <h1 class="jg-titulo" id="jgTitulo">Cargando…</h1>
  <p class="jg-instruccion" id="jgInstruccion"></p>
  <details class="jg-porque" id="jgPorque" hidden>
    <summary>🧠 ¿Qué entrena?</summary>
    <p id="jgBeneficio"></p>
  </details>
  <section class="jg-ficha" id="jgFicha" hidden aria-labelledby="jgTitulo">
    <ul class="jg-datos" id="jgDatos"></ul>
    <p class="jg-record" id="jgRecord" hidden></p>
    <button type="button" class="jg-empezar" id="jgEmpezar">Empezar</button>
    <a class="jg-volver" id="jgVolver" href="juegos.html">← Volver a los juegos</a>
    <p class="jg-aviso">Juego recreativo y educativo para practicar en casa. No evalúa ni diagnostica: si algo te preocupa, <a href="index.html#consulta-home">consultá con el equipo</a>.</p>
  </section>
  <div id="jgContenedor"></div>
</main>

<div id="jgError" hidden style="text-align:center; padding: 100px 20px;">
  <p style="font-size:1.1rem; color:#3a5a6a; margin-bottom:20px;">No encontramos ese juego, o todavía está en camino 🚧</p>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js" defer></script>

<script src="js/zzfx.js" defer></script>
<script src="js/sfx.js" defer></script>
<script src="js/game-engine.js" defer></script>
<script type="module">
  const params = new URLSearchParams(window.location.search);
  const juegoId = params.get("id");
  const juego = juegoId ? CatalogoJuegos.porId(juegoId) : null;

  if (!juego || !juego.disponible) {
    document.getElementById("juego-area").hidden = true;
    document.getElementById("jgError").hidden = false;
  } else {
    document.title = `${juego.nombre} | Centro Sinapsis`;
    document.getElementById("jgTitulo").textContent = juego.nombre;
    document.getElementById("jgInstruccion").textContent = juego.descripcion;
    if (juego.beneficio) {
      document.getElementById("jgBeneficio").textContent = juego.beneficio;
      document.getElementById("jgPorque").hidden = false;
    }

    // Esperamos a saber si hay sesión de Google antes de arrancar el
    // juego, para que los puntos y el progreso se guarden ya mismo
    // en la cuenta correcta (una sola vez; ver comentario abajo).
    let arrancado = false;
    const sesionLista = new Promise((resolver) => {
      Auth.onCambio((user) => {
        if (arrancado) return; // ignoramos cambios de sesión mientras el juego ya está en curso
        arrancado = true;
        if (user) Storage.vincularUsuario(user).then(resolver, resolver);
        else resolver();
      });
    });
    const cargarJuego = () => sesionLista.then(() => {
      const script = document.createElement("script");
      script.src = juego.archivo;
      document.body.appendChild(script);
    });

    // Ficha previa: qué es, para qué edad, cuánto dura y el récord propio,
    // antes de que arranque cualquier cronómetro. "Jugar de nuevo" la saltea.
    let directo = false;
    try { directo = sessionStorage.getItem("jg-directo") === juego.id; sessionStorage.removeItem("jg-directo"); } catch (e) {}
    if (directo) {
      cargarJuego();
    } else {
      const cat = CatalogoJuegos.categoriaPorId(juego.categoria);
      const DIF = { facil: "Fácil", media: "Intermedio", dificil: "Desafiante" };
      const datos = [
        cat && `${cat.icono} ${cat.nombre}`,
        juego.edadMin && `Desde ${juego.edadMin} años`,
        juego.duracion && `⏱ ${juego.duracion}`,
        DIF[juego.dificultad] && `Nivel: ${DIF[juego.dificultad]}`,
        juego.necesita === "sesion" && "Para jugar con otra persona",
      ].filter(Boolean);
      const ul = document.getElementById("jgDatos");
      datos.forEach((t) => { const li = document.createElement("li"); li.textContent = t; ul.appendChild(li); });
      const prog = Storage.getProgreso(juego.id);
      if (prog.partidas > 0) {
        const rec = document.getElementById("jgRecord");
        rec.textContent = `Jugaste ${prog.partidas} ${prog.partidas === 1 ? "vez" : "veces"}` +
          (juego.puntuable && prog.mejorPuntaje > 0 ? ` · tu mejor puntaje: ${prog.mejorPuntaje}` : "") +
          " (se guarda en este dispositivo o en tu cuenta).";
        rec.hidden = false;
        document.getElementById("jgEmpezar").textContent = "Jugar otra vez";
      }
      const ficha = document.getElementById("jgFicha");
      ficha.hidden = false;
      const btn = document.getElementById("jgEmpezar");
      if (window.__geVolverA) document.getElementById("jgVolver").href = window.__geVolverA;
      btn.addEventListener("click", () => {
        if (window.gtag) gtag("event", "juego_iniciado", { juego_id: juego.id, categoria: juego.categoria });
        ficha.remove();
        cargarJuego();
      }, { once: true });
    }
  }
</script>
